<!doctype html>
<html lang="zh-CN" class="light">
<head>
  <meta charset="utf-8">
  <title>Conversation Navigator 测试页面</title>
  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { background: #fff; color: #343840; font: 15px/1.8 system-ui, sans-serif; }
    header { height: 64px; padding: 17px 32px; border-bottom: 1px solid #ededf2; }
    header small { float: right; color: #8a8e99; }
    main { height: calc(100vh - 144px); overflow-y: auto; padding: 32px 100px 64px; }
    article { width: min(680px, 100%); margin: 0 auto 42px; }
    [data-message-author-role="user"] { background: #f3f3f7; padding: 15px 20px; border-radius: 18px; margin-left: 90px; }
    [data-message-author-role="assistant"] { min-height: 280px; padding: 24px 0 8px; }
    h2 { font-size: 19px; font-weight: 600; }
    p { margin: 12px 0; }
    footer { height: 80px; padding: 18px; text-align: center; color: #8a8e99; border-top: 1px solid #ededf2; }
    .dark body { background: #17171c; color: #ececf2; }
    .dark [data-message-author-role="user"] { background: #2b2b33; }
    .dark header, .dark footer { border-color: #30303a; }
  </style>
</head>
<body>
  <header>ChatGPT <small>Conversation Navigator · 本地测试</small></header>
  <main aria-label="模拟聊天消息"></main>
  <footer>发送消息开始对话</footer>
  <script>
    if (location.hash === "#capture-shield") {
      window.pageBlockedNavigationClicks = 0;
      window.ordinaryPageClicks = 0;
      window.addEventListener("click", event => {
        if (event.target.id === "conversation-navigator-extension") {
          window.pageBlockedNavigationClicks++;
          event.stopImmediatePropagation();
        }
      }, true);
      const ordinary = document.createElement("button");
      ordinary.id = "ordinary-page-button";
      ordinary.textContent = "普通网页按钮";
      ordinary.style.cssText = "position:fixed;left:12px;bottom:20px";
      ordinary.onclick = () => window.ordinaryPageClicks++;
      document.body.append(ordinary);
    }
    const main = document.querySelector("main");
    window.addTurn = (question, answer = "这是对应回答的内容。") => {
      const article = document.createElement("article");
      const user = document.createElement("div");
      user.dataset.messageAuthorRole = "user";
      const text = document.createElement("div");
      text.className = "whitespace-pre-wrap";
      text.textContent = question;
      user.append(text);
      article.append(user);
      if (answer !== null) {
        const reply = document.createElement("div");
        reply.dataset.messageAuthorRole = "assistant";
        const heading = document.createElement("h2");
        heading.textContent = "回答 " + (main.children.length + 1);
        const body = document.createElement("p");
        body.textContent = answer;
        reply.append(heading, body);
        article.append(reply);
      }
      main.append(article);
      return article;
    };
    const questions = [
      "帮我整理一下这个项目的主要目标和实施步骤。",
      "如果对话越来越长，有没有办法快速定位之前的回答？",
      "导航列能不能只显示短横杠，鼠标移上去再显示问题？",
      "解释一下 MutationObserver 怎样跟随新增消息更新导航。",
      "给我一个兼容深色模式的界面方案。",
      "最后总结一下 Chrome 插件的安装步骤。"
    ];
    questions.forEach(question => addTurn(question,
      "我们可以把每一次提问映射为右侧的一条短横杠。悬停时显示问题原文，点击时滚动到对应回答的开头。这样即使对话很长，也能轻松回到之前讨论过的内容。"));
  </script>
</body>
</html>
